name: Build and test

on:
  workflow_call:
    inputs:
      ref:
        description: Exact source revision to check out
        type: string
        required: true

permissions:
  contents: read

env:
  RUST_VERSION: 1.98.1
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: Rust formatting
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - name: Check formatting
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component rustfmt
          cargo +"$RUST_VERSION" fmt --all -- --check

  native:
    name: Native ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Install toolchain and test dependencies
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy
          rustup default "$RUST_VERSION"
          rustc -vV | grep -Fx "host: $TARGET"
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update
            sudo apt-get install -y sqlite3
          fi
          sqlite3 --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ matrix.target }}-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}

      - name: Test the workspace
        run: cargo test --release --workspace --locked

      - name: Lint all targets
        run: cargo clippy --release --workspace --all-targets --locked -- -D warnings

      - name: Build and smoke-test the binary
        run: |
          set -euo pipefail
          cargo build --release --locked -p celld
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/celld/Cargo.toml | head -1)
          target/release/celld --version | grep -F "$version"

      - name: Package binary, provenance and licences
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p out
          gzip -9 -n -c target/release/celld > "out/celld-$TARGET.gz"
          cp LICENSE NOTICE out/
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          target = os.environ['TARGET']
          root = pathlib.Path('out')
          asset = root / f'celld-{target}.gz'
          digest = hashlib.sha256(asset.read_bytes()).hexdigest()
          (root / f'{asset.name}.sha256').write_text(f'{digest}  {asset.name}\n')
          record = {
              'commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'target': target,
              'rust': subprocess.check_output(['rustc', '--version'], text=True).strip(),
              'cargoLockSha256': hashlib.sha256(pathlib.Path('Cargo.lock').read_bytes()).hexdigest(),
              'binarySha256': hashlib.sha256(pathlib.Path('target/release/celld').read_bytes()).hexdigest(),
              'assetSha256': digest,
          }
          (root / f'celld-{target}.build.json').write_text(json.dumps(record, indent=2) + '\n')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: celld-native-${{ matrix.target }}
          path: out/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  container:
    name: Container ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: linux/amd64
            suffix: amd64
          - runner: ubuntu-22.04-arm
            platform: linux/arm64
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - uses: docker/setup-buildx-action@v3
      - name: Resolve build identity
        id: source
        run: |
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "version=$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/celld/Cargo.toml | head -1)" >> "$GITHUB_OUTPUT"
          mkdir -p out
      # The Dockerfile's final image depends on its test and Clippy stage.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            CELLD_COMMIT=${{ steps.source.outputs.commit }}
            CELLD_VERSION=${{ steps.source.outputs.version }}
          tags: celld:sha-${{ steps.source.outputs.commit }}-${{ matrix.suffix }}
          outputs: type=oci,dest=out/celld-linux-${{ matrix.suffix }}.oci.tar
          cache-from: type=gha,scope=celld-${{ matrix.suffix }}
          cache-to: type=gha,scope=celld-${{ matrix.suffix }},mode=max
          provenance: mode=max
          sbom: true
      - name: Checksum container archive
        run: cd out && sha256sum *.oci.tar > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: celld-container-linux-${{ matrix.suffix }}
          path: out/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
