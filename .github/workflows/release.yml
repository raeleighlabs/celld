name: Release

# Build a checked draft first. Publishing it is a separate action, after which
# the exact tagged source is checked again before images reach our registry.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Fork release tag, for example v0.6.3-raeleigh-celld.1'
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name }}-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/raeleighlabs/celld

jobs:
  source:
    name: Validate fork release identity
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      tag: ${{ steps.source.outputs.tag }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}
      - name: Validate tag against the checked-out version
        id: source
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/celld/Cargo.toml | head -1)
          suffix="${RELEASE_TAG#"v$version-raeleigh-celld."}"
          if [[ "$RELEASE_TAG" != "v$version-raeleigh-celld.$suffix" || ! "$suffix" =~ ^[1-9][0-9]*$ ]]; then
            echo "Use v$version-raeleigh-celld.N with a positive fork revision; upstream tags are reserved." >&2
            exit 1
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  checks:
    needs: source
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.source.outputs.commit }}

  draft-release:
    name: Attest and draft the release
    if: github.event_name == 'workflow_dispatch'
    needs: [source, checks]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.source.outputs.commit }}
      - uses: actions/download-artifact@v4
        with:
          pattern: celld-native-*
          path: assets
          merge-multiple: true
      - name: Verify the release assets
        run: |
          set -euo pipefail
          cd assets
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu aarch64-apple-darwin; do
            sha256sum --check "celld-$target.gz.sha256"
            test -s "celld-$target.build.json"
          done
          test -s LICENSE
          test -s NOTICE
          cat ./*.gz.sha256 > SHA256SUMS
      - name: Attest build provenance
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: assets/*.gz
      - name: Create a new draft without replacing existing releases
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
          SOURCE_SHA: ${{ needs.source.outputs.commit }}
        run: |
          set -euo pipefail
          # Existing tags must point to the tested commit. Never move an upstream tag.
          existing=$(git ls-remote --tags origin "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")
          if [ -n "$existing" ]; then
            echo "Tag already exists; choose a new fork revision." >&2
            exit 1
          fi
          printf 'Raeleigh celld fork built from `%s`.\n\nAll native and container checks passed.\n' "$SOURCE_SHA" > notes.md
          gh release create "$RELEASE_TAG" --draft --target "$SOURCE_SHA" \
            --title "$RELEASE_TAG" --notes-file notes.md assets/*

  build-container:
    name: Publish architecture image
    if: github.event_name == 'release'
    needs: [source, checks]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: linux/amd64
            suffix: amd64
          - runner: ubuntu-22.04-arm
            platform: linux/arm64
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.source.outputs.commit }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            CELLD_COMMIT=${{ needs.source.outputs.commit }}
            CELLD_VERSION=${{ needs.source.outputs.version }}
          tags: ${{ env.IMAGE }}:sha-${{ needs.source.outputs.commit }}-${{ matrix.suffix }}
          push: true
          cache-from: type=gha,scope=celld-${{ matrix.suffix }}
          cache-to: type=gha,scope=celld-${{ matrix.suffix }},mode=max
          provenance: mode=max
          sbom: true
      - name: Retain immutable image digest
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          mkdir -p digests
          printf '%s\n' "$DIGEST" > "digests/${{ matrix.suffix }}.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: release-digest-${{ matrix.suffix }}
          path: digests/*
          if-no-files-found: error

  publish-container:
    name: Publish multi-architecture image
    if: github.event_name == 'release'
    needs: [source, build-container]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: actions/download-artifact@v4
        with:
          pattern: release-digest-*
          path: digests
          merge-multiple: true
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish tags from exact architecture digests
        id: manifest
        env:
          RELEASE_TAG: ${{ needs.source.outputs.tag }}
          SOURCE_SHA: ${{ needs.source.outputs.commit }}
        run: |
          set -euo pipefail
          amd64=$(cat digests/amd64.txt)
          arm64=$(cat digests/arm64.txt)
          [[ "$amd64" =~ ^sha256:[a-f0-9]{64}$ && "$arm64" =~ ^sha256:[a-f0-9]{64}$ ]]
          docker buildx imagetools create \
            --tag "$IMAGE:sha-$SOURCE_SHA" \
            --tag "$IMAGE:$RELEASE_TAG" \
            --tag "$IMAGE:${RELEASE_TAG#v}" \
            --tag "$IMAGE:latest" \
            "$IMAGE@$amd64" "$IMAGE@$arm64"
          digest=$(docker buildx imagetools inspect "$IMAGE:sha-$SOURCE_SHA" --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Attest image provenance
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/raeleighlabs/celld
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
