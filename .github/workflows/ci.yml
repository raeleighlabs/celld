name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ github.sha }}

  ci:
    name: CI passed
    if: always()
    needs: checks
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Require every check and artefact build
        env:
          RESULT: ${{ needs.checks.result }}
        run: test "$RESULT" = success
